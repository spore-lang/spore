[project]
name = "spore-lang"
description = "Spore language toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [{ name = "Zhan Rongrui" }]
keywords = ["compiler", "language", "spore"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Compilers",
]
dynamic = ["version"]

[project.urls]
Documentation = "https://github.com/spore-lang/spore#readme"
Homepage = "https://github.com/spore-lang/spore"
Releases = "https://github.com/spore-lang/spore/releases"
Repository = "https://github.com/spore-lang/spore"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
bindings = "bin"
include = ["stdlib/**/*.sp"]
manifest-path = "crates/spore/Cargo.toml"
strip = true
