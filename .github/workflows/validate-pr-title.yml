name: "Validate PR Title"

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-title:
    name: Check PR Title Format
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title matches conventions
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"].strip()

          # Pattern explanation:
          # ^                         - start of string
          # (?:[^\w\s]+\s+)?          - optional emoji prefix (one or more non-word, non-space chars + space)
          # (?:feat|fix|refactor|docs|chore|ci|test|perf|build|revert|style)
          #                           - commit type (required)
          # (?:\([^)]+\))?            - optional scope in parentheses
          # :\s+                      - colon and space (required)
          # .+                        - message (required, at least 1 character)
          # $                         - end of string

          pattern = r"^(?:[^\w\s]+\s+)?(?:feat|fix|refactor|docs|chore|ci|test|perf|build|revert|style)(?:\([^)]+\))?:\s+.+"

          if re.match(pattern, title):
              print("✅ PR title is valid!")
              print(f"   Title: {title}")
              sys.exit(0)

          # Helpful error message
          print("❌ PR title does not match the required format.", file=sys.stderr)
          print("", file=sys.stderr)
          print("Required format: [emoji] type[(scope)]: message", file=sys.stderr)
          print("", file=sys.stderr)
          print("Valid commit types:", file=sys.stderr)
          types = ["feat", "fix", "refactor", "docs", "chore", "ci", "test", "perf", "build", "revert", "style"]
          print("  " + ", ".join(types), file=sys.stderr)
          print("", file=sys.stderr)
          print("Examples of valid titles:", file=sys.stderr)
          print("  ✨ feat: add new CLI command", file=sys.stderr)
          print("  ✨ feat(parser): add support for async functions", file=sys.stderr)
          print("  🐛 fix: resolve memory leak in transformer", file=sys.stderr)
          print("  🐛 fix(lsp): fix hover position calculation", file=sys.stderr)
          print("  📝 docs: update installation guide", file=sys.stderr)
          print("  ♻️ refactor(core): simplify import resolution", file=sys.stderr)
          print("  🔧 chore: update dependencies", file=sys.stderr)
          print("", file=sys.stderr)
          print(f"Got: '{title}'", file=sys.stderr)
          sys.exit(1)
          PY
