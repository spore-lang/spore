name: Policy - PR

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened, synchronize]
  merge_group:
    branches:
      - main
    types:
      - checks_requested

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-message:
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    name: PR message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check PR title
        uses: zrr1999/zendev/actions/validate-title@60faebf29a0467d06cfb3df79ec0e039ae1f2048 # v0.0.5
        with:
          text: ${{ github.event.pull_request.title }}

      - name: Check PR body headings
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          def extract_h2_headings(text: str) -> list[str]:
              in_fence = False
              headings = []
              for line in text.splitlines():
                  stripped = line.strip()
                  if stripped.startswith("```"):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      continue
                  if re.match(r"^##\s+\S", stripped):
                      headings.append(re.sub(r"^##\s+", "", stripped))
              return headings

          payload = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          body = (payload.get("pull_request") or {}).get("body") or ""
          template = Path(".github/pull_request_template.md").read_text(encoding="utf-8")

          expected = extract_h2_headings(template)
          actual = extract_h2_headings(body)

          if actual != expected:
              print("PR body headings do not match the repository template.", file=sys.stderr)
              print(f"Expected headings: {expected}", file=sys.stderr)
              print(f"Actual headings:   {actual}", file=sys.stderr)
              raise SystemExit(1)

          print("PR body headings match the repository template.")
          PY
