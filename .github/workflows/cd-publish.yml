name: "CD - Publish"

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  merge_group:
    branches:
      - main
    types:
      - checks_requested

concurrency:
  group: cd-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-wheel:
    timeout-minutes: 30
    name: wheel (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            runner: ubuntu-latest
            artifact: wheel-linux-x86_64
          - label: macos-x86_64
            runner: macos-15-intel
            artifact: wheel-macos-x86_64
          - label: macos-arm64
            runner: macos-14
            artifact: wheel-macos-arm64
          - label: windows-x86_64
            runner: windows-latest
            artifact: wheel-windows-x86_64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.12.6
          rust-toolchain: "1.95"
          command: build
          manylinux: "2014"
          args: --release --locked --compatibility pypi --out dist

      - name: Smoke-test built wheel
        shell: bash
        run: |
          repo_root="$PWD"
          wheel_path="$repo_root/dist/$(basename dist/*.whl)"
          tmp_dir="$(mktemp -d)"
          uv tool run --from "$wheel_path" spore new "$tmp_dir/package-smoke"
          cat > "$tmp_dir/native-build.sp" <<'EOF'
          fn main() -> Bool {
              true
          }
          EOF
          (
            cd "$tmp_dir"
            uv tool run --from "$wheel_path" spore build native-build.sp
          )
          test -f "$tmp_dir/native-build.o"
          uv tool run --from "$wheel_path" spore check "$repo_root/examples/demo.sp"
          uv tool run --from "$wheel_path" spore test "$repo_root/examples/demo.sp"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spore-${{ matrix.artifact }}
          path: dist/*.whl
          if-no-files-found: error

  build-sdist:
    timeout-minutes: 20
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95"

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.12.6
          rust-toolchain: "1.95"
          command: sdist
          args: --out dist

      - name: Smoke-test source distribution
        shell: bash
        run: |
          repo_root="$PWD"
          sdist_path="$repo_root/dist/$(basename dist/*.tar.gz)"
          uv tool run --from "$sdist_path" spore check "$repo_root/examples/demo.sp"
          uv tool run --from "$sdist_path" spore test "$repo_root/examples/demo.sp"

      - name: Upload sdist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spore-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    timeout-minutes: 15
    name: publish
    runs-on: ubuntu-latest
    needs:
      - build-wheel
      - build-sdist
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/spore-lang
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: false
      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: spore-*
          path: dist
          merge-multiple: true
      - name: List release artifacts
        run: ls -1 dist
      - name: Publish to PyPI
        run: uv publish dist/*

  github-release:
    timeout-minutes: 10
    name: github-release
    runs-on: ubuntu-latest
    needs:
      - build-wheel
      - build-sdist
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: spore-*
          path: dist
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --clobber
          else
            gh release create "$RELEASE_TAG" dist/*.whl dist/*.tar.gz --verify-tag --generate-notes
          fi
